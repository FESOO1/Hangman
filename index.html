<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="menu">
        <button type="button" class="menu-button" id="startButton">START</button>
    </div>
    <main>
        <div class="main-top">
            <h3 class="main-top-logo">Hangman</h3>
            <h4 class="main-top-category" id="categoryText"></h4>
            <button class="main-top-menu-button" type="button" id="menuOpenButton">
                <svg class="main-top-menu-button-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" color="#000000" fill="none">
                    <path d="M4 5L20 5" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
                    <path d="M4 12L20 12" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
                    <path d="M4 19L20 19" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
            </button>
        </div>
        <div class="main-hangman-word">
            <div class="main-hangman"></div>
            <div class="main-word"></div>
        </div>
        <div class="main-keyboard">
            <div class="main-keyboard-inner">
                <button disabled class="main-keyboard-inner-button" type="button" value="q">Q</button>
                <button disabled class="main-keyboard-inner-button" type="button" value="w">W</button>
                <button disabled class="main-keyboard-inner-button" type="button" value="e">E</button>
                <button disabled class="main-keyboard-inner-button" type="button" value="r">R</button>
                <button disabled class="main-keyboard-inner-button" type="button" value="t">T</button>
                <button disabled class="main-keyboard-inner-button" type="button" value="y">Y</button>
                <button disabled class="main-keyboard-inner-button" type="button" value="u">U</button>
                <button disabled class="main-keyboard-inner-button" type="button" value="i">I</button>
                <button disabled class="main-keyboard-inner-button" type="button" value="o">O</button>
                <button disabled class="main-keyboard-inner-button" type="button" value="p">P</button>
            </div>
            <div class="main-keyboard-inner">
                <button disabled class="main-keyboard-inner-button" type="button" value="a">A</button>
                <button disabled class="main-keyboard-inner-button" type="button" value="s">S</button>
                <button disabled class="main-keyboard-inner-button" type="button" value="d">D</button>
                <button disabled class="main-keyboard-inner-button" type="button" value="f">F</button>
                <button disabled class="main-keyboard-inner-button" type="button" value="g">G</button>
                <button disabled class="main-keyboard-inner-button" type="button" value="h">H</button>
                <button disabled class="main-keyboard-inner-button" type="button" value="j">J</button>
                <button disabled class="main-keyboard-inner-button" type="button" value="k">K</button>
                <button disabled class="main-keyboard-inner-button" type="button" value="l">L</button>
            </div>
            <div class="main-keyboard-inner">
                <button disabled class="main-keyboard-inner-button" type="button" value="z">Z</button>
                <button disabled class="main-keyboard-inner-button" type="button" value="x">X</button>
                <button disabled class="main-keyboard-inner-button" type="button" value="c">C</button>
                <button disabled class="main-keyboard-inner-button" type="button" value="v">V</button>
                <button disabled class="main-keyboard-inner-button" type="button" value="b">B</button>
                <button disabled class="main-keyboard-inner-button" type="button" value="n">N</button>
                <button disabled class="main-keyboard-inner-button" type="button" value="m">M</button>
            </div>
        </div>
        <div class="main-menu">
            <div class="main-menu-itself">
                <h2 class="main-menu-itself-header" id="popupMenuText">Congratulations, <br>You found the word!!!</h2>
                <div class="main-menu-itself-buttons">
                    <button class="main-menu-itself-button" type="button" id="playAgainButton">PLAY AGAIN</button>
                    <button class="main-menu-itself-button" type="button" id="mainMenuButton">MAIN MENU</button>
                </div>
            </div>
        </div>
    </main>
    
    <script src="./script.js"></script>
</body>
</html>
